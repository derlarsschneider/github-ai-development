# Reusable workflow: the whole AI development cycle.
# Projects call it with a small workflow file, see templates/workflows/ai-development.yml.
name: AI Development (orchestrate)

on:
  workflow_call:
    inputs:
      ai_ref:
        description: Git ref of github-ai-development to load the orchestrator and role prompts from. Keep it equal to the ref in "uses:".
        type: string
        default: main
    secrets:
      AI_PAT:
        description: Fine-grained PAT with Contents, Issues and Pull requests (read/write) on the project.
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token from "claude setup-token".
        required: true

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.AI_PAT }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AI_PAT }}
          fetch-depth: 0

      # The orchestrator and the role prompts come from github-ai-development,
      # never from the project or the agent's branch.
      - name: Checkout orchestrator
        uses: actions/checkout@v4
        with:
          repository: derlarsschneider/github-ai-development
          ref: ${{ inputs.ai_ref }}
          token: ${{ secrets.AI_PAT }}
          path: .ai-orchestrator

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Move orchestrator out of the workspace
        run: |
          mkdir -p "$RUNNER_TEMP/orchestrator"
          cp -r .ai-orchestrator/.github/ai .ai-orchestrator/.github/ai-roles "$RUNNER_TEMP/orchestrator/"
          rm -rf .ai-orchestrator

      - name: Route event
        id: route
        run: node "$RUNNER_TEMP/orchestrator/ai/cli.mjs" route

      - name: Init
        if: steps.route.outputs.action == 'init'
        env:
          ISSUE: ${{ steps.route.outputs.issue }}
        run: node "$RUNNER_TEMP/orchestrator/ai/cli.mjs" init "$ISSUE"

      # Label changes without an agent run: answer to a question, approval, feedback.
      - name: Resume, approve or revise
        if: contains(fromJSON('["resume","approve","revise"]'), steps.route.outputs.action)
        env:
          ACTION: ${{ steps.route.outputs.action }}
          ISSUE: ${{ steps.route.outputs.issue }}
        run: node "$RUNNER_TEMP/orchestrator/ai/cli.mjs" "$ACTION" "$ISSUE"

      - name: Prepare branch
        if: steps.route.outputs.action == 'run'
        env:
          BRANCH: ${{ steps.route.outputs.branch }}
        run: |
          git config user.name "AI Development"
          git config user.email "ai-development@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Setup Flutter
        if: steps.route.outputs.action == 'run'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install project dependencies
        if: steps.route.outputs.action == 'run'
        run: |
          flutter --version
          if [ -f pubspec.yaml ]; then
            flutter pub get
          fi

      - name: Install Claude Code
        if: steps.route.outputs.action == 'run'
        run: npm install -g @anthropic-ai/claude-code

      - name: Build prompt
        if: steps.route.outputs.action == 'run'
        env:
          PHASE: ${{ steps.route.outputs.phase }}
          ISSUE: ${{ steps.route.outputs.issue }}
        run: node "$RUNNER_TEMP/orchestrator/ai/cli.mjs" prompt "$PHASE" "$ISSUE"

      - name: Run agent (${{ steps.route.outputs.role_name }})
        if: steps.route.outputs.action == 'run'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAX_TURNS: ${{ steps.route.outputs.max_turns }}
          TOOLS: ${{ steps.route.outputs.tools }}
        run: |
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --output-format json \
            --max-turns "$MAX_TURNS" \
            --allowedTools "$TOOLS" \
            > "$RUNNER_TEMP/claude-output.json"

      - name: Finish
        if: always() && steps.route.outputs.action == 'run'
        env:
          PHASE: ${{ steps.route.outputs.phase }}
          ISSUE: ${{ steps.route.outputs.issue }}
        run: node "$RUNNER_TEMP/orchestrator/ai/cli.mjs" finish "$PHASE" "$ISSUE"

      - name: Summary
        if: always() && steps.route.outputs.action == 'run'
        env:
          ROLE_NAME: ${{ steps.route.outputs.role_name }}
        run: |
          {
            echo "## AI Development: $ROLE_NAME"
            echo
            if [ -s "$RUNNER_TEMP/claude-output.json" ]; then
              jq -r '"- Result: \(.subtype)\n- Turns: \(.num_turns)\n- Duration: \(.duration_ms / 1000 | floor) s\n- Cost (API equivalent): \(.total_cost_usd) USD"' "$RUNNER_TEMP/claude-output.json" || true
            else
              echo "No Claude output."
            fi
            echo
            echo '```json'
            cat .ai-result.json 2>/dev/null || echo "(no .ai-result.json)"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload agent output
        if: always() && steps.route.outputs.action == 'run'
        uses: actions/upload-artifact@v4
        with:
          name: claude-output-${{ steps.route.outputs.phase }}-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-output.json
          if-no-files-found: ignore
