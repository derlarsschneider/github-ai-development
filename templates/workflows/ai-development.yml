# Calls the reusable AI Development workflow. Copy this file to .github/workflows/
# of a project. Everything else (orchestrator, role prompts) comes from github-ai-development.
name: AI Development
run-name: >-
  ${{ format('#{0} {1} · {2}', github.event.issue.number,
  github.event_name == 'issue_comment' && 'Comment' ||
  github.event.label.name == 'ai-development' && 'Init' ||
  github.event.label.name == 'ai:requirements' && 'Requirements Engineer' ||
  github.event.label.name == 'ai:develop' && 'Developer' ||
  github.event.label.name == 'ai:test' && 'Tester' ||
  github.event.label.name == 'ai:review' && 'Reviewer' ||
  format('Label {0}', github.event.label.name),
  github.event.issue.title) }}

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: ai-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ai:
    uses: derlarsschneider/github-ai-development/.github/workflows/orchestrate.yml@main
    with:
      ai_ref: main
    secrets:
      AI_PAT: ${{ secrets.AI_PAT }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
