# AI Development: copy this file to .github/workflows/ of your project.
# Adapt the marked "Project environment" steps, "checks" and "tools" to your project.
# Everything else (orchestration, role prompts) comes from github-ai-development.
name: AI Development
run-name: >-
  ${{ format('#{0} {1} · {2}', github.event.issue.number,
  github.event_name == 'issue_comment' && 'Comment' ||
  github.event.label.name == 'ai-development' && 'Init' ||
  github.event.label.name == 'ai:requirements' && 'Requirements Engineer' ||
  github.event.label.name == 'ai:develop' && 'Developer' ||
  github.event.label.name == 'ai:test' && 'Tester' ||
  github.event.label.name == 'ai:review' && 'Reviewer' ||
  format('Label {0}', github.event.label.name),
  github.event.issue.title) }}

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: ai-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - id: ai
        uses: derlarsschneider/github-ai-development/route@v1
        with:
          github_token: ${{ secrets.AI_PAT }}

      # --- Project environment: replace with your own setup (runs only when an agent runs) ---
      # Example for Flutter. Use any setup action, `services:` or `run:` steps your project needs.
      - if: steps.ai.outputs.run == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: steps.ai.outputs.run == 'true'
        run: flutter pub get
      # ---

      - if: always() && steps.ai.outputs.run == 'true'
        uses: derlarsschneider/github-ai-development/run@v1
        with:
          job_status: ${{ job.status }}
          github_token: ${{ secrets.AI_PAT }}
          # Claude access: a subscription token or an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Commands Developer, Tester and Reviewer run to check the code, one per line.
          checks: |
            flutter analyze
            flutter test
          # Extra tools for Developer and Tester (Claude Code syntax). The Reviewer never gets them.
          tools: Bash(flutter:*),Bash(dart:*)
